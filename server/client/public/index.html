<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交易日志查询</title>
    <script>
      (function () {
        var p = location.pathname;
        var base = p.endsWith("/") ? p : p.slice(0, p.lastIndexOf("/") + 1);
        document.write('<base href="' + base + '" />');
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand-block">
          <div class="brand-logo" aria-label="华龙证券">
            <img class="brand-image" src="images/hualong-logo-clean.png" alt="华龙证券" />
          </div>
          <div>
            <h1 id="system-name">交易日志</h1>
          </div>
        </div>
        <div class="actions">
          <!-- 登录记录按钮暂时隐藏，页面默认展示登录记录视图
          <button id="login-records-tab" class="secondary" type="button">登录记录</button>
          -->
          <!-- 用户管理按钮暂时隐藏，统一用 admin 用户
          <button id="users-tab" class="secondary" type="button">用户管理</button>
          -->
          <button id="dbquery-tab" class="secondary" type="button" hidden>数据库查询</button>
          <div class="user-line">
            <p id="current-user" class="current-user">正在校验登录状态</p>
            <a id="logout-button" href="#" role="button">退出</a>
          </div>
        </div>
      </section>

      <section id="login-records-view">
        <section class="section-head">
          <div>
            <h2>查询条件</h2>
            <p>按日期筛选，或按用户id、手机号、接口中文名精确查询。</p>
          </div>
        </section>

        <section class="panel">
          <form id="record-form" class="grid-form records-form">
            <label>
              开始日期
              <input id="record-start-date" name="startDate" type="date" />
            </label>
            <label class="stack-date-end">
              结束日期
              <input id="record-end-date" name="endDate" type="date" />
            </label>
            <label>
              用户 ID
              <input name="user_id" placeholder="用户ID，精确匹配，不支持模糊" />
            </label>
            <label>
              手机号
              <input name="mobile_no" placeholder="手机号，精确匹配，不支持模糊" />
            </label>
            <label>
              IMEI
              <input name="imei" placeholder="设备 IMEI，精确匹配" />
            </label>
            <label>
              IMSI
              <input name="imsi" placeholder="SIM 卡 IMSI，精确匹配" />
            </label>
            <label>
              IP
              <input name="ip" placeholder="客户端 IP，精确匹配" />
            </label>
            <label>
              MAC
              <input name="mac" placeholder="网卡 MAC，精确匹配" />
            </label>
            <label>
              UDID
              <input name="udid" placeholder="设备 UDID，精确匹配" />
            </label>
            <label>
              结果
              <select name="succ">
                <option value="">全部</option>
                <option value="1">成功</option>
                <option value="0">失败</option>
                <option value="-1">未知</option>
              </select>
            </label>
            <label>
              每页条数
              <input id="page-size" name="pageSize" type="number" min="1" max="200" value="10" />
            </label>
            <div class="form-actions">
              <button type="submit">查询</button>
              <button id="export-btn" type="button" class="secondary">导出</button>
              <button id="sort-order-btn" type="button" class="secondary" title="切换时间排序方向">倒序 ↓</button>
            </div>
          </form>
          <input id="page" name="page" type="hidden" value="1" form="record-form" />
          <p id="record-message" class="message" aria-live="polite"></p>
        </section>

        <section class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-primary">用户 ID</th>
                <th class="col-primary">手机号</th>
                <th class="col-primary">会话 ID</th>
                <th class="col-primary">接口号</th>
                <th class="col-primary">结果</th>
                <th class="col-primary">阶段</th>
                <th class="col-primary">时间</th>
                <th>耗时(ms)</th>
                <th>IMEI</th>
                <th>IMSI</th>
                <th>IP</th>
                <th>MAC</th>
                <th>UDID</th>
                <th class="col-action">详情</th>
              </tr>
            </thead>
            <tbody id="login-records"></tbody>
          </table>
        </section>

        <section class="pager">
          <button id="prev-page" class="secondary" type="button">上一页</button>
          <span id="page-info">第 1 / 1 页</span>
          <button id="next-page" class="secondary" type="button">下一页</button>
        </section>
      </section>

      <section id="dbquery-view" hidden>
        <section class="section-head">
          <div>
            <h2>数据库查询</h2>
            <p>输入 MySQL 连接参数与 SQL，执行并查看查询结果。此入口可通过配置文件关闭。</p>
          </div>
          <button id="dbquery-back" class="secondary" type="button">返回登录记录</button>
        </section>

        <section class="panel">
          <form id="dbquery-form" class="conn-form">
            <div class="conn-grid">
              <label>
                主机
                <input id="dbq-host" name="host" placeholder="127.0.0.1" />
              </label>
              <label>
                端口
                <input id="dbq-port" name="port" type="number" min="1" max="65535" value="3306" />
              </label>
              <label>
                用户名
                <input id="dbq-user" name="user" placeholder="root" />
              </label>
              <label>
                密码
                <input id="dbq-password" name="password" type="password" autocomplete="off" placeholder="无密码留空" />
              </label>
              <label>
                数据库
                <input id="dbq-database" name="database" placeholder="KDS_MONI" />
              </label>
              <label>
                字符集
                <input id="dbq-charset" name="charset" value="utf8" />
              </label>
            </div>
            <label class="sql-label">
              SQL
              <textarea id="dbq-sql" name="sql" rows="6" placeholder="SELECT * FROM TBL_TRADE_LOG_2023_10_13 LIMIT 50"></textarea>
            </label>
            <div class="dbquery-actions">
              <button type="submit">执行查询</button>
              <span class="hint">最多返回 500 行，请为查询加上过滤条件</span>
            </div>
          </form>
          <p id="dbquery-message" class="message" aria-live="polite"></p>
        </section>

        <div id="dbquery-result" class="table-wrap" hidden></div>
      </section>

      <!-- 用户管理视图暂时隐藏，统一用 admin 用户
      <section id="users-view" hidden>
        <section class="section-head">
          <div>
            <h2>用户管理</h2>
            <p>新增用户时，密码会以带盐 scrypt 哈希保存到数据库。</p>
          </div>
        </section>

        <section class="panel">
          <form id="user-form" class="grid-form user-form">
            <label>
              用户名
              <input name="username" required placeholder="user_01" />
            </label>
            <label>
              显示名
              <input name="display_name" required placeholder="业务用户" />
            </label>
            <label>
              密码
              <input name="password" required type="password" placeholder="至少 8 位" />
            </label>
            <label>
              角色
              <select name="role">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
              </select>
            </label>
            <button type="submit">新增用户</button>
          </form>
          <p id="user-message" class="message" aria-live="polite"></p>
        </section>

        <section class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>显示名</th>
                <th>角色</th>
                <th>创建时间</th>
              </tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </section>
      </section>
      -->
    </main>

    <div id="error-modal" class="modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="error-title">
      <div class="modal-panel">
        <h2 id="error-title">提示</h2>
        <p id="error-text"></p>
        <button id="error-close" type="button">确定</button>
      </div>
    </div>

    <div id="detail-modal" class="modal detail-modal" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="modal-panel detail-panel">
        <h2 id="detail-title">记录详情</h2>
        <div id="detail-body" class="detail-body"></div>
        <button id="detail-close" type="button">关闭</button>
      </div>
    </div>

    <div id="export-modal" class="modal detail-modal" hidden role="dialog" aria-modal="true" aria-labelledby="export-title">
      <div class="modal-panel export-panel">
        <h2 id="export-title">导出数据</h2>
        <p id="export-desc">请选择导出范围，文件将以 CSV 格式下载。</p>
        <div id="export-range-group" class="radio-group">
          <label>
            <input type="radio" name="export-range" value="current" checked />
            <span>当前页记录</span>
            <em id="export-current-hint" class="hint"></em>
          </label>
          <label>
            <input type="radio" name="export-range" value="all" />
            <span>全部匹配记录（含跨页）</span>
            <em id="export-all-hint" class="hint">单次最多导出 10 万条</em>
          </label>
        </div>
        <p id="export-status" class="export-status" hidden></p>
        <div class="modal-actions">
          <button id="export-cancel" type="button" class="secondary">取消</button>
          <button id="export-confirm" type="button">确认导出</button>
        </div>
      </div>
    </div>

    <button id="back-to-top" class="back-to-top" type="button" aria-label="返回顶部" title="返回顶部">
      ↑
    </button>

    <script src="app.js" type="module"></script>
  </body>
</html>
