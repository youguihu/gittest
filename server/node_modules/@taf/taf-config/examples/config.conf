<taf>
    <application>
        <client>
            locator    = taf.tafregistry.QueryObj@tcp -h 172.27.208.171 -p 17890
            locatorb   = taf.tafregistry.QueryObj@tcp -h 172.27.208.171 -p 17890:tcp -h 172.27.34.213 -p 17890
            stat       = taf.tafstat.StatObj
            property   = taf.tafproperty.PropertyObj
            config     = taf.tafconfig.ConfigObj
            log        = taf.taflog.LogObj
            notify     = taf.tafnotify.NotifyObj
            modulename = TRom.NodeJsTestServer
            async-invoke-timeout=60000
        </client>
    </application>
</taf>

<main>
	DevLocator 	= taf.tafregistry.QueryObj@tcp -h 172.27.208.171 -p 17890:tcp -h 172.27.34.213 -p 17890
	DevServer  	= taf.tafconfig.ConfigObj@tcp -h 10.12.22.13 -p 8080  -t 60000
	LocalServer = taf.tafconfig.ConfigObj@tcp -h 10.12.22.13 -p 8080  -t 60000
	ProxyServer = taf.tafconfig.ConfigObj@tcp -h 10.12.22.13 -p 8080  -t 60000
	timeout     = 600
</main>
